    <title>Daily Wisdom - 365 Days of Inspiration</title>

            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .quote-text {
            font-family: 'Playfair Display', serif;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-hover:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.2);
        }
    </style>

        const quoteEl = document.getElementById('quote-display');
        const authorEl = document.getElementById('author-display');
        const dateEl = document.getElementById('current-date');
        const toast = document.getElementById('toast');

        function getDayOfYear() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        function updateDisplay(quote) {
            quoteEl.parentElement.classList.remove('fade-in');
            void quoteEl.offsetWidth; 
            quoteEl.parentElement.classList.add('fade-in');

            quoteEl.innerText = quote.text;
            authorEl.innerText = `— ${quote.author}`;
        }

        function loadDailyQuote() {
            const dayIndex = getDayOfYear();
            const quote = quotesPool[dayIndex % quotesPool.length];
            updateDisplay(quote);
            
            // Explicitly formatting to show Day of Week + Full Date
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            dateEl.innerText = new Date().toLocaleDateString(undefined, options);
        }

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotesPool.length);
            const quote = quotesPool[randomIndex];
            updateDisplay(quote);
            dateEl.innerText = "Momentary Inspiration";
        }

        function copyQuote() {
            const text = `"${quoteEl.innerText}" ${authorEl.innerText}`;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        window.onload = loadDailyQuote;
    </script>
</body>
</html>
