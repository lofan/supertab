<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Formatter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-3xl font-bold mb-2">Quote Formatter</h1>
            <p class="text-blue-100 text-sm">Convert '"Quote" - Author' to JSON format.</p>
        </div>

        <!-- Content Area -->
        <div class="p-6 flex flex-col space-y-6">
            
            <!-- Input Section -->
            <div class="flex flex-col space-y-2">
                <label for="inputText" class="text-sm font-semibold text-gray-700">Input Text</label>
                <div class="relative">
                    <textarea 
                        id="inputText" 
                        rows="4" 
                        class="w-full p-4 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow outline-none resize-y"
                        placeholder='e.g., "Can I be me?" - Whitney Houston'
                    ></textarea>
                    <!-- Inline Clear Button -->
                    <button 
                        id="clearInputBtn" 
                        class="absolute top-4 right-4 text-gray-400 hover:text-red-500 focus:outline-none transition-colors hidden"
                        title="Clear Input"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-1">Format: "Your quote here" - Author Name</p>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-center space-x-4">
                <button 
                    id="formatBtn" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50"
                >
                    Format Quote
                </button>
                <button 
                    id="clearBtn" 
                    class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-6 rounded-lg transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-opacity-50"
                >
                    Clear
                </button>
            </div>

            <!-- Output Section -->
            <div class="flex flex-col space-y-2">
                <div class="flex justify-between items-center">
                    <label for="outputText" class="text-sm font-semibold text-gray-700">Output JSON</label>
                    <button 
                        id="copyBtn" 
                        class="text-sm text-blue-600 hover:text-blue-800 font-medium transition-colors focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled
                    >
                        Copy to Clipboard
                    </button>
                </div>
                <div class="relative">
                    <pre 
                        id="outputText" 
                        class="w-full p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm font-mono text-gray-800 overflow-x-auto min-h-[100px] whitespace-pre-wrap"
                    ></pre>
                    <!-- Error Message Display -->
                    <div id="errorMsg" class="absolute top-0 left-0 w-full h-full bg-red-50 text-red-600 p-4 rounded-lg hidden flex items-center justify-center font-medium">
                        Invalid format. Please use "Quote" - Author.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const inputText = document.getElementById('inputText');
        const clearInputBtn = document.getElementById('clearInputBtn');
        const outputText = document.getElementById('outputText');
        const formatBtn = document.getElementById('formatBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const errorMsg = document.getElementById('errorMsg');

        // Function to parse and format the text
        function formatText() {
            const rawInput = inputText.value.trim();
            
            // Hide previous errors and clear output
            errorMsg.classList.add('hidden');
            outputText.textContent = '';
            copyBtn.disabled = true;

            if (!rawInput) {
                return;
            }

            try {
                // Regex to match "Quote" - Author or “Quote” - Author
                // It looks for text inside standard or smart quotes, followed by a hyphen or en/em dash, then the author name.
                const regex = /^["“'”](.*?)["'”]\s*[-–—]\s*(.*)$/;
                const match = rawInput.match(regex);

                if (match && match.length === 3) {
                    const quote = match[1].trim();
                    const author = match[2].trim();

                    // Create the result object
                    const resultObj = {
                        text: quote,
                        author: author
                    };

                    // Format as a single-line JavaScript-like object string
                    const jsonOutput = `{ text: ${JSON.stringify(quote)}, author: ${JSON.stringify(author)} }`;
                    
                    // Display the output
                    outputText.textContent = jsonOutput;
                    copyBtn.disabled = false;
                } else {
                    // Show error if format doesn't match
                    errorMsg.classList.remove('hidden');
                    errorMsg.textContent = 'Invalid format. Ensure it looks like: "Quote" - Author';
                }
            } catch (err) {
                console.error("Parsing error:", err);
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = 'An error occurred during parsing.';
            }
        }

        // Event Listeners
        formatBtn.addEventListener('click', formatText);

        // Show/hide inline clear button based on input content
        inputText.addEventListener('input', () => {
            if (inputText.value.length > 0) {
                clearInputBtn.classList.remove('hidden');
            } else {
                clearInputBtn.classList.add('hidden');
            }
        });

        // Inline clear button logic
        clearInputBtn.addEventListener('click', () => {
            inputText.value = '';
            clearInputBtn.classList.add('hidden');
            inputText.focus();
        });

        // Allow pressing Enter (if holding shift, it adds new line, else formats)
        inputText.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                formatText();
            }
        });

        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.textContent = '';
            errorMsg.classList.add('hidden');
            copyBtn.disabled = true;
            copyBtn.textContent = 'Copy to Clipboard';
            clearInputBtn.classList.add('hidden');
            inputText.focus();
        });

        copyBtn.addEventListener('click', () => {
            const textToCopy = outputText.textContent;
            if (textToCopy) {
                try {
                    // Try modern clipboard API first (may fail in some iframes without permissions)
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showCopySuccess();
                    }).catch(err => {
                        fallbackCopyTextToClipboard(textToCopy);
                    });
                } catch (err) {
                    // Fallback for older browsers or restricted iframes
                    fallbackCopyTextToClipboard(textToCopy);
                }
            }
        });

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            
            // Avoid scrolling to bottom
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopySuccess();
                } else {
                    console.error('Fallback: Copying text command was unsuccessful');
                }
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }

            document.body.removeChild(textArea);
        }

        function showCopySuccess() {
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            copyBtn.classList.add('text-green-600');
            
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.classList.remove('text-green-600');
            }, 2000);
        }
        
        // Initialize with the user's example if empty
        window.onload = () => {
             inputText.value = '"Can I be me?" - Whitney Houston';
             clearInputBtn.classList.remove('hidden');
        };

    </script>
</body>
</html>
